<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register | CGPA Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header-container">
      <h1>CGPA Calculator</h1>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="main-nav">
        <a href="index.html">Home</a>
        <a href="semester.html">Calculator</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" class="active">Login</a>
      </nav>
  </header>

  <main class="container main-content">
    <div class="auth-box">
      <div class="auth-tabs">
        <button type="button" onclick="switchTab('login')" id="tabLogin" class="tab-btn active">Login</button>
        <button type="button" onclick="switchTab('register')" id="tabRegister" class="tab-btn">Register</button>
      </div>

      <form id="formLogin" onsubmit="demoAuthSubmit(event, 'Login form previewed — no login needed to calculate.')">
        <h3>Student Login</h3>
        <div class="form-group">
          <label>Email or Matric Number</label>
          <input type="text" placeholder="e.g. Chike@gmail.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-block">Log In</button>
      </form>

      <form id="formRegister" class="hidden" onsubmit="demoAuthSubmit(event, 'Registration form previewed — head straight to Calculator!')">
        <h3>Student Registration</h3>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="e.g. Tinubu gotta go">
        </div>
        <div class="form-group">
          <label>Matric Number</label>
          <input type="text" placeholder="e.g.c'mon younno ur reg num">
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" placeholder="e.g. Information Technology">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="e.g. Escanor@gmail.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Create password">
        </div>
        <button type="submit" class="btn btn-block">Register Account</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Chike's CGPA Calculator Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
